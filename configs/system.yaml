# ============================================================
# AIC Video Retrieval System — Full Configuration
# ============================================================

system:
  name: "AIC Video Retrieval System"
  version: "1.0.0"
  environment: "kaggle"     # kaggle | local
  log_level: "INFO"

# ============================================================
# Hardware
# ============================================================
hardware:
  device: "cuda"            # cuda | cpu
  num_workers: 4
  pin_memory: true

# ============================================================
# CLIP Visual Encoder
# ============================================================
clip:
  model_name: "ViT-B-32"
  pretrained: "openai"
  feature_dim: 512
  normalize: true
  batch_size: 64

# ============================================================
# FAISS Index
# ============================================================
faiss:
  index_type: "HNSW"
  hnsw_m: 32
  hnsw_ef_search: 64
  metric: "inner_product"   # inner_product = cosine after L2 norm

# ============================================================
# BGE-M3 Text Encoder
# ============================================================
bge:
  model_name: "BAAI/bge-m3"
  feature_dim: 1024
  use_fp16: true
  batch_size: 64

# ============================================================
# Qdrant Text Index
# ============================================================
qdrant:
  url: "http://localhost:6333"
  collection_captions: "captions"
  collection_ocr: "ocr"
  collection_asr: "asr"
  vector_dim: 1024
  distance: "Cosine"

# ============================================================
# VLM — Qwen2.5-VL (Q&A and TRAKE alignment)
# ============================================================
vlm:
  model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "cuda"
  load_in_4bit: true        # Set false for A100/H100 (full precision)
  max_new_tokens: 200
  generate_vi: true         # Captions: generate both EN and VI

# ============================================================
# Feature Extractors
# ============================================================
ocr:
  lang: "vi"                # PaddleOCR language
  min_confidence: 0.6
  use_gpu: true
  use_angle_cls: true

asr:
  model_size: "large-v3"    # Faster-Whisper model
  device: "cuda"
  compute_type: "float16"   # float16 (GPU) | int8 (CPU)
  language: "vi"
  beam_size: 5

# ============================================================
# Retrieval Parameters
# ============================================================
retrieval:
  top_k_initial: 100        # Candidates from FAISS
  top_k_fusion: 50          # After RRF fusion
  top_k_final: 10           # After reranking

  rrf_k: 60                 # RRF constant (Cormack 2009)

  # Retriever weights in RRF fusion
  weights:
    visual: 1.0
    caption: 0.9
    ocr: 0.7
    asr: 0.6

# ============================================================
# Q&A Pipeline
# ============================================================
qa:
  max_frames_to_check: 10   # Max candidates to run VLM on
  relevance_threshold: 0.5  # Min VLM relevance confidence
  answer_conf_threshold: 0.6 # Early-stop if answer confidence >= this

# ============================================================
# TRAKE Pipeline
# ============================================================
trake:
  top_k_videos: 5           # Candidate videos from Phase 1
  top_k_frames_per_event: 20 # Frames per event in Phase 2
  enable_vlm_verify: true   # Use VLM to verify event alignment
  vlm_blend_ratio: 0.6      # VLM weight in score blend (1-ratio = CLIP weight)
  enforce_temporal_order: true

# ============================================================
# Kaggle Dataset Paths (auto-detected if not set)
# ============================================================
kaggle_paths:
  dataset_slug: "aic-hcmc-data"
  indexes_slug: "aic-hcmc-indexes"

  # Relative to /kaggle/input/{dataset_slug}/
  clip_features_dir: "clip-features-32-aic25-b/clip-features-32"
  map_keyframes_dir: "map-keyframes-aic25-b1/map-keyframes"
  keyframes_img_dir: "keyframes/keyframes"
  videos_dir: "Videos_{batch_id}_a/video"

  # Working dir outputs
  output_root: "/kaggle/working"
  indexes_dir: "/kaggle/working/indexes"
  ocr_dir: "/kaggle/working/ocr"
  captions_dir: "/kaggle/working/captions"
  subtitles_dir: "/kaggle/working/subtitles"
  submission_dir: "/kaggle/working/submission"
